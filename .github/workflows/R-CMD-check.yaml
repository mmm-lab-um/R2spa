# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Single-thread the BLAS so the corrected-SE goldens (T3 in
      # test-tspa_corrected_se.R) are run-to-run deterministic. There is no
      # cross-OS BLAS *version* pinning available as a CI action (r-lib/actions
      # has no setup-blas), so the residual Accelerate (macOS) vs OpenBLAS
      # (Linux) difference is absorbed by the goldens' 1e-2 tolerance instead.
      # VECLIB_MAXIMUM_THREADS targets the macOS Accelerate/vecLib path; the
      # others cover OpenBLAS/OpenMP/MKL.
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Lavaan version axis (PLAN 04, decision 3): the estimation path couples to
  # lavaan internals in R/lavaan_compat.R. The pinned baseline is the
  # "tested up to" reference; the dev slot is the partable-drift tripwire and
  # runs only the scoped test subset (OpenMx-heavy full check stays
  # affordable). No 0.6.x slot: the code requires the 0.7-x `lavTech` export.
  lavaan-baseline:
    runs-on: ubuntu-latest
    name: lavaan 0.7-2 pinned (full check)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Pin lavaan 0.7-2 (current CRAN, then archive)
        # 0.7-2 is still the current CRAN release, so the archive URL 404s
        # until a newer lavaan pushes it into /Archive/. Try current CRAN
        # first, then the archive, and hard-fail if neither yields the pin.
        run: |
          want <- "0.7-2"
          have <- if (requireNamespace("lavaan", quietly = TRUE))
            as.character(packageVersion("lavaan")) else NA_character_
          if (!identical(have, want)) {
            urls <- c(
              paste0("https://cran.r-project.org/src/contrib/lavaan_", want, ".tar.gz"),
              paste0("https://cran.r-project.org/src/contrib/Archive/lavaan/lavaan_", want, ".tar.gz")
            )
            for (url in urls) {
              try(install.packages(url, repos = "https://cloud.r-project.org",
                                   type = "source"), silent = TRUE)
              if (requireNamespace("lavaan", quietly = TRUE) &&
                  identical(as.character(packageVersion("lavaan")), want)) break
            }
          }
          stopifnot(identical(as.character(packageVersion("lavaan")), want))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          check_args: 'c("--no-manual")'

  lavaan-dev-tripwire:
    runs-on: ubuntu-latest
    name: lavaan dev (partable drift tripwire, scoped subset)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes
          needs: heavy

      - name: Install lavaan (development)
        # Upstream account was renamed: Lavaan/lavaan (404s since 2026-08).
        run: |
          remotes::install_github("yrosseel/lavaan", dependencies = FALSE, quiet = TRUE)
        shell: Rscript {0}

      - name: Install R2spa
        run: R CMD INSTALL --no-multiarch --with-keep.source .
        shell: bash

      - name: Run scoped test subset (tspa/compat/product)
        run: |
          testthat::test_local(
            ".",
            filter = "^(tspa|tspa_render|lavaan_compat|compute_fs_prod)$",
            load_package = "installed",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
